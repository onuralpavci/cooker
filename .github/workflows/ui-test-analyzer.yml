name: UI Test Analyzer Agent

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Repository to analyze (owner/repo)'
        required: false
        default: 'midas-engineering/mobile-android'
      target_workflow:
        description: 'Workflow name to analyze'
        required: false
        default: 'Maestro UI Test'
      run_count:
        description: 'Number of recent runs to analyze'
        required: false
        default: '10'
  schedule:
    - cron: '0 7 * * *'  # 10 AM Turkey time (UTC+3) - after UI tests complete

jobs:
  analyze-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Ollama Container
        run: |
          docker run -d -p 11434:11434 --name ollama alpine/ollama
          echo "Ollama container started"

      - name: Wait for Ollama to be ready
        run: |
          echo "Waiting for Ollama..."
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags; then
              echo "Ollama is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Pull LLM model
        run: |
          echo "Pulling gpt-oss:20b model..."
          docker exec ollama ollama pull gpt-oss:20b
          echo "Model pulled successfully!"
          docker exec ollama ollama list

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup GitHub CLI
        run: |
          echo "${{ secrets.GH_PAT }}" | gh auth login --with-token
          gh auth status

      - name: Run UI Test Analyzer Agent
        id: run-agent
        run: |
          # Run agent and capture output
          ./gradlew runUITestAnalyzer | tee agent_output.txt
          
          # Extract just the agent response (after "Agent Response:" line)
          sed -n '/📝 Agent Response:/,/BUILD SUCCESSFUL/p' agent_output.txt | \
            sed '1d;$d' | \
            sed 's/^==*$//' | \
            sed '/^$/d' > agent_response.txt
          
          echo "Agent output saved to agent_response.txt"
        env:
          OLLAMA_URL: http://localhost:11434
          OLLAMA_MODEL: gpt-oss:20b
          OLLAMA_TEMPERATURE: "0.7"
          TARGET_REPO: ${{ inputs.target_repo || 'midas-engineering/mobile-android' }}
          TARGET_WORKFLOW: ${{ inputs.target_workflow || 'Maestro UI Test' }}
          RUN_COUNT: ${{ inputs.run_count || '10' }}

      - name: Send Slack Notification
        if: always() && steps.run-agent.outcome != 'skipped'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_UI_TEST_WEBHOOK_URL }}
        run: |
          # Check if webhook URL is configured
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "⚠️ SLACK_UI_TEST_WEBHOOK_URL secret not configured - skipping Slack notification"
            exit 0
          fi
          
          # Read agent response
          RESPONSE=$(cat agent_response.txt 2>/dev/null || echo "⚠️ Agent failed to generate response")
          
          # Extract JSON from response (agent outputs Block Kit JSON)
          # Find the first '{' and extract everything from there
          JSON_PAYLOAD=$(echo "$RESPONSE" | sed -n '/{/,/^}$/p' | jq -c .)
          
          if [ $? -ne 0 ] || [ -z "$JSON_PAYLOAD" ]; then
            echo "❌ Failed to parse agent output as JSON"
            echo "Agent output:"
            echo "$RESPONSE"
            # Fallback: Send error message in plain format
            JSON_PAYLOAD="{\"text\":\"⚠️ Agent failed to generate valid Block Kit JSON. Check workflow logs.\"}"
          fi
          
          # Send Block Kit JSON directly to Slack
          echo "📤 Sending Block Kit notification to Slack..."
          echo "Payload preview: $(echo "$JSON_PAYLOAD" | jq -r '.text')"
          
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" \
            "$SLACK_WEBHOOK_URL"
          
          if [ $? -eq 0 ]; then
            echo "✅ Slack notification sent successfully"
          else
            echo "❌ Failed to send Slack notification"
            exit 1
          fi

      - name: Stop Ollama Container
        if: always()
        run: docker stop ollama || true


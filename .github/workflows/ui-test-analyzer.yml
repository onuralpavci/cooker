name: UI Test Analyzer Agent

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Repository to analyze (owner/repo)'
        required: false
        default: 'midas-engineering/mobile-android'
      target_workflow:
        description: 'Workflow name to analyze'
        required: false
        default: 'Maestro UI Test'
      run_count:
        description: 'Number of recent runs to analyze'
        required: false
        default: '10'
  schedule:
    - cron: '0 7 * * *'  # 10 AM Turkey time (UTC+3) - after UI tests complete

jobs:
  analyze-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Ollama Container
        run: |
          docker run -d -p 11434:11434 --name ollama alpine/ollama
          echo "Ollama container started"

      - name: Wait for Ollama to be ready
        run: |
          echo "Waiting for Ollama..."
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags; then
              echo "Ollama is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Pull LLM model
        run: |
          echo "Pulling gpt-oss:20b model..."
          docker exec ollama ollama pull gpt-oss:20b
          echo "Model pulled successfully!"
          docker exec ollama ollama list

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup GitHub CLI
        run: |
          echo "${{ secrets.GH_PAT }}" | gh auth login --with-token
          gh auth status

      - name: Run UI Test Analyzer Agent
        id: run-agent
        run: ./gradlew runUITestAnalyzer
        env:
          OLLAMA_URL: http://localhost:11434
          OLLAMA_MODEL: gpt-oss:20b
          OLLAMA_TEMPERATURE: "0.7"
          TARGET_REPO: ${{ inputs.target_repo || 'midas-engineering/mobile-android' }}
          TARGET_WORKFLOW: ${{ inputs.target_workflow || 'Maestro UI Test' }}
          RUN_COUNT: ${{ inputs.run_count || '10' }}
          SLACK_UI_TEST_WEBHOOK_URL: ${{ secrets.SLACK_UI_TEST_WEBHOOK_URL }}

      - name: Stop Ollama Container
        if: always()
        run: docker stop ollama || true


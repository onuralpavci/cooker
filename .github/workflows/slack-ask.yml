name: Slack Ask

on:
  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      channel_id:
        description: 'Slack Channel ID (e.g., C0AD1763YAC)'
        required: true
        type: string
      question:
        description: 'Question to ask about the channel history'
        required: true
        type: string

  # Trigger from external sources (Lambda, API, etc.)
  repository_dispatch:
    types: [slack-ask]

env:
  JAVA_VERSION: '21'
  OPENAI_MODEL: 'gpt-4o-mini'

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      
      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
      
      - name: 📋 Set Parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "channel_id=${{ github.event.inputs.channel_id }}" >> $GITHUB_OUTPUT
            echo "question=${{ github.event.inputs.question }}" >> $GITHUB_OUTPUT
          else
            echo "channel_id=${{ github.event.client_payload.channel_id }}" >> $GITHUB_OUTPUT
            echo "question=${{ github.event.client_payload.question }}" >> $GITHUB_OUTPUT
          fi
      
      - name: 🔍 Debug Parameters
        run: |
          echo "📊 Channel ID: ${{ steps.params.outputs.channel_id }}"
          echo "❓ Question: ${{ steps.params.outputs.question }}"
          echo "📊 Slack Bot Token: ${{ secrets.SLACK_BOT_TOKEN != '' && '✅ Set' || '❌ Not set' }}"
          echo "📊 OpenAI API Key: ${{ secrets.OPENAI_API_KEY != '' && '✅ Set' || '❌ Not set' }}"
          echo "📊 OpenAI Model: ${{ env.OPENAI_MODEL }}"
      
      - name: ❓ Run Slack Q&A Agent
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ env.OPENAI_MODEL }}
        run: |
          echo "🚀 Starting Slack Q&A Agent..."
          echo "   Channel: ${{ steps.params.outputs.channel_id }}"
          echo "   Question: ${{ steps.params.outputs.question }}"
          echo "   LLM: OpenAI ${{ env.OPENAI_MODEL }}"
          
          ./gradlew run \
            --args="slack-ask ${{ steps.params.outputs.channel_id }} ${{ steps.params.outputs.question }}" \
            --no-daemon
      
      - name: 📤 Notify on Failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          if [ -n "$SLACK_BOT_TOKEN" ]; then
            curl -X POST \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"channel\":\"${{ steps.params.outputs.channel_id }}\",\"text\":\"❌ Soru yanıtlanamadı. GitHub Actions loglarını kontrol edin.\"}" \
              "https://slack.com/api/chat.postMessage"
          fi


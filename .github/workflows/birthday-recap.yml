name: Birthday PR Recap Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # 9 AM Turkey time (UTC+3)

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Ollama Container
        run: |
          docker run -d -p 11434:11434 --name ollama alpine/ollama
          echo "Ollama container started"

      - name: Wait for Ollama to be ready
        run: |
          echo "Waiting for Ollama..."
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags; then
              echo "Ollama is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Pull DeepSeek R1 model
        run: |
          echo "Pulling deepseek-r1:1.5b model..."
          docker exec ollama ollama pull deepseek-r1:1.5b
          echo "Model pulled successfully!"
          docker exec ollama ollama list

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup GitHub CLI
        run: |
          echo "${{ secrets.GH_PAT }}" | gh auth login --with-token
          gh auth status

      - name: Run Birthday Recap Agent
        run: ./gradlew run
        env:
          OLLAMA_URL: http://localhost:11434
          OLLAMA_MODEL: deepseek-r1:1.5b
          OLLAMA_TEMPERATURE: "0.7"

      - name: Stop Ollama Container
        if: always()
        run: docker stop ollama || true
